# Direct trust keystore. Default is empty. Must be set.
direct.trust.keystore.location.canton=
direct.trust.keystore.password.location.canton=

# Source / target directories. Default is empty. Must be set.
directory.source=
directory.target=

# Logging
spring.main.banner-mode=LOG
spring.output.ansi.enabled=always
logging.file.name=${project.artifactId}.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=0
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.log

# Application bootstrap enabled. Default is true.
application.bootstrap.enabled=true

# Version of the application. Default is the artifact version.
version=${project.version}

# Generate pipes graph. Default false.
generateGraphs=false

# Format the output files. Default true.
formatOutput=true

# Min number of days allowed between eVoting from and eVoting to. Default 10.
eVotingFromTo.min.delta.allowed=10

# Grace period in seconds. Default 900.
authorization.gracePeriod=900

# Minimal id value for test counting circle. Default 10000.
countingCircle.testControl.minValue=10000

# Set all counting circles as test. Default false.
countingCircle.allTest=false

# Bypass check dates consistency. Default false.
bypass.checkConsistency.dates=false

# Bypass check output XSD validation. Default false.
bypass.checkOutputXSDValidation=false

# Default answer types. Default is 2 for standard and 4 for tiebreak.
votes.defaultAnswerType.standard = 2
votes.defaultAnswerType.tiebreak = 4

# Enable diplomatic bag. Default false.
diplomaticBag.enabled=false

# Diplomatic bag by country code. These should not be modified.
diplomaticBag.AU=AUSTRALIA
diplomaticBag.TH=THAILAND
diplomaticBag.BR=BRAZIL

